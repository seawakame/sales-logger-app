# public/ フォルダを GitHub Pages へ自動デプロイするワークフロー
# 使い方: GitHub の Settings > Pages > Source を「GitHub Actions」に設定するだけ
#         以降は push するたびに自動で本番へ反映されます
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pages の設定を読み込む
        uses: actions/configure-pages@v5

      - name: public/ フォルダをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
